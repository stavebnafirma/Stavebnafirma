<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --ink:#86cfa5; --accent:#3ba56d; --accent-ink:#06140c; --accent-soft:#2f6447; --tint:#1b2d23;
  --ok:#77d3a1; --ok-bg:#16301f; --warn:#f0c46a; --warn-bg:#3a2c12; --lock:#a7b3ac; --lock-bg:#252f2a; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211d; --line:#2c3731; --fg:#e4ebe6; --muted:#9caaa2;
  --brand:#0d1611; --brand-fg:#e9f2ec; --brand-hi:#7fd3a2; --sub1:#1a2a21;
  --ink:#86cfa5; --accent:#3ba56d; --accent-ink:#06140c; --accent-soft:#2f6447; --tint:#1b2d23;
  --ok:#77d3a1; --ok-bg:#16301f; --warn:#f0c46a; --warn-bg:#3a2c12; --lock:#a7b3ac; --lock-bg:#252f2a; --bad:#ff8a80; color-scheme:dark}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-fg);box-shadow:0 1px 0 rgba(0,0,0,.12),0 6px 18px -12px rgba(0,0,0,.5)}

label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-weight:400;width:100%;min-width:0}
input[type=date],input[type=time]{display:block;box-sizing:border-box;max-width:100%}
.grid2>*,.grid3>*{min-width:0}
/* iOS/iPadOS Safari: dátum a čas inak ignorujú výšku, centrujú text a pretekajú z bunky */
@supports (-webkit-touch-callout:none){input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;height:42px;line-height:22px;text-align:left}

/* Rozpoznanie a import rozpočtu – čisté funkcie (bez DOM) */
const BUDGET_FIELDS=[
  ["por","Poradové číslo"],["code","Kód položky"],["desc","Názov položky"],
  ["mj","Merná jednotka"],["qty","Množstvo"],["price","Jednotková cena"],["total","Cena spolu"]
];
function normText(v){return String(v??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim()}
function classifyHeader(v){
  const t=normText(v); if(!t||t.length>40) return null;
  if(/^(c|c\.|cis\.?|cislo|pc|p\.c\.?|p\. c\.|por\.?|por\. ?c\.?|poradove cislo|poradie)$/.test(t)) return "por";
  if(/^kod( polozky)?\b|^cislo polozky$|^kod$/.test(t)) return "code";
  if(/popis|nazov/.test(t)) return "desc";
  if(/^m\.? ?j\.?$|^merna jednotka|^jednotka$|^mj\b/.test(t)) return "mj";
  if(/j\.? ?cena|jednotkov|^jc\b|cena jedn|jedn\.? ?cena/.test(t)) return "price";
  if(/uprav/.test(t)) return null;
  if(/mnozstvo|vymera/.test(t)) return "qty";
  if(/celkom|spolu/.test(t)) return "total";
  return null;
}
function toNum(v){
  if(typeof v==="number") return isFinite(v)?v:null;
  if(v==null) return null;
  let s=String(v).replace(/\s| |€|eur/gi,"");
  if(!s) return null;
  if(/^-?[\d.]+,\d+$/.test(s)) s=s.replace(/\./g,"").replace(",",".");
  else s=s.replace(",",".");
  return /^-?\d+(\.\d+)?$/.test(s)?parseFloat(s):null;
}
/* nájde riadok hlavičky v jednom hárku; rows = pole riadkov (pole buniek) */
function detectHeader(rows){
  let best=null;
  const lim=Math.min(rows.length,300);
  for(let r=0;r<lim;r++){
    const row=rows[r]||[]; const map={}; let score=0;
    row.forEach((v,c)=>{const f=classifyHeader(v); if(f&&map[f]==null){map[f]=c;score++}});
    if(map.desc!=null&&map.mj!=null&&(map.code!=null||map.qty!=null)&&(!best||score>best.score)) best={row:r,map,score};
  }
  return best;
}
function cell(row,c){return c==null?"":row[c]}
function str(v){return String(v??"").replace(/\s+/g," ").trim()}
/* vytiahne položky podľa mapovania stĺpcov */
function extractBudget(rows,headerRow,map){
  const items=[],warnings=[]; let declaredTotal=null, seq=0, section="";
  for(let r=headerRow+1;r<rows.length;r++){
    const row=rows[r]||[];
    const mj=str(cell(row,map.mj)), desc=str(cell(row,map.desc)), code=str(cell(row,map.code)), por=str(cell(row,map.por));
    const qty=toNum(cell(row,map.qty)), price=toNum(cell(row,map.price)), total=toNum(cell(row,map.total));
    const mjIsText=mj&&toNum(mj)===null;
    if(mjIsText&&qty!==null&&(code||desc)){
      seq++;
      const it={por:por||String(seq),code,desc,mj,qty,price:price??0,total:total!=null?total:+((qty*(price??0)).toFixed(2)),section};
      if(price!=null&&total!=null&&Math.abs(qty*price-total)>Math.max(0.05,Math.abs(total)*0.001)) it.check="Množstvo × cena nesedí s cenou spolu";
      items.push(it); continue;
    }
    if(!mj&&desc){
      const nd=normText(desc);
      const isTotal=/^(celkom|sucet|spolu|cena celkom|naklady z rozpoctu|rozpocet celkom)/.test(nd)||(/celkom$/.test(nd)&&!code&&!por);
      if(isTotal){ if(total!=null&&declaredTotal==null) declaredTotal=total; continue }
      if((code||por)&&total!=null) section=desc;
    }
  }
  const sum=items.reduce((s,i)=>s+i.total,0);
  if(!items.length) warnings.push("Nenašli sa žiadne položky. Skontroluj priradenie stĺpcov.");
  if(declaredTotal!=null&&Math.abs(declaredTotal-sum)>0.05) warnings.push(`Súčet položiek (${sum.toFixed(2)}) nesedí s riadkom Celkom v súbore (${declaredTotal.toFixed(2)}).`);
  if(items.length&&items.every(i=>!i.price)) warnings.push("Rozpočet nemá vyplnené jednotkové ceny (všetky sú 0).");
  const bad=items.filter(i=>i.check).length; if(bad) warnings.push(`${bad} položiek: množstvo × jednotková cena nesedí s cenou spolu.`);
  return {items,sum,declaredTotal,warnings};
}
/* prejde všetky hárky a vyberie najlepší */
function detectWorkbook(sheets){ // sheets: [{name, rows}]
  let best=null;
  sheets.forEach((s,i)=>{const h=detectHeader(s.rows); if(!h) return;
    const ex=extractBudget(s.rows,h.row,h.map);
    const sc=ex.items.length*10+h.score;
    if(!best||sc>best.sc) best={sc,sheet:i,header:h.row,map:h.map};
  });
  return best;
}

const RIGHT_MODS=[["personal","Personalistika"],["doprava","Doprava a logistika"],["pozicovna","Požičovňa"],["stavba","Stavba"]];
const isAdmin=u=>!!u&&u.companyRole==="admin";
function rightOf(u,mod){if(!u)return null;if(isAdmin(u))return "edit";return (u.rights||{})[mod]||null}

const canEdit=mod=>rightOf(me,mod)==="edit";

function can(p,act,entry){
  const r0=roleIn(p),r=r0==="spravca"?"admin":r0;
  switch(act){
    case"diary.create":return["admin","stavbyveduci","majster"].includes(r);
    case"diary.edit":return entry&&!entry.locked&&(r==="admin"||r==="stavbyveduci"||(r==="majster"&&entry.authorId===me.id));
    case"diary.lock":return entry&&!entry.locked&&["admin","stavbyveduci"].includes(r);
    case"team.invite":return["admin","stavbyveduci"].includes(r);
    case"team.remove":return r==="admin";
    case"econ.view":return r==="admin"||r==="sledovanie";
    case"budget.import":return["admin","stavbyveduci"].includes(r)&&!(p.invoices&&p.invoices.length);
    case"budget.upload":return["admin","stavbyveduci"].includes(r);
    case"inv.view":return["admin","sledovanie","stavbyveduci","dozor","citanie"].includes(r);
    case"inv.edit":return["admin","stavbyveduci"].includes(r);
    case"inv.unlock":return r==="admin";
    case"inv.approve":return r==="dozor";
    case"diary.note":return r==="dozor";
    case"kd.convene":return r==="dozor";
    case"diary.request":return["admin","stavbyveduci","majster"].includes(r);
    case"settings":return["admin","stavbyveduci"].includes(r);
  }return false}

async function hashPw(pw){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=5381;for(const c of pw)h=((h<<5)+h+c.charCodeAt(0))|0;return "x:"+h}}

  const stored=userPw(a.tid,a.u);

  if(await hashPw(pw)!==stored){view.loginErr="Nesprávne heslo.";render();const el=$("#loginPw");if(el)el.focus();return}
  useTenant(a.tid);finishLogin(a.u)}

function processImage(file,maxSide,removeWhite){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const k=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.naturalWidth*k));c.height=Math.max(1,Math.round(img.naturalHeight*k));const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);
    if(removeWhite){const d=x.getImageData(0,0,c.width,c.height),a=d.data;for(let i=0;i<a.length;i+=4){const m=Math.min(a[i],a[i+1],a[i+2]);
      if(m>=235)a[i+3]=0;else if(m>=190)a[i+3]=Math.round(a[i+3]*(235-m)/45)}x.putImageData(d,0,0)}
    URL.revokeObjectURL(url);res({data:c.toDataURL("image/png"),w:c.width,h:c.height})};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"))};img.src=url})}

/* ---------- Doprava a logistika: rodný list stroja ---------- */
const CATS={
  car:{l:"Osobné a úžitkové vozidlá",unit:"km",oev:true,main:true,terms:[["STK",24],["EK",24],["PZP",12],["Havarijné poistenie",12],["Diaľničná známka",12]]},
  truck:{l:"Nákladné vozidlá",unit:"km",oev:true,main:true,terms:[["STK",12],["EK",12],["Overenie tachografu",24],["PZP",12],["Havarijné poistenie",12],["Diaľničná známka",12]]},
  machine:{l:"Stavebné stroje",unit:"h",oev:true,main:true,terms:[["PZP",12],["Havarijné poistenie",12],["Revízia",12]]},
  small:{l:"Drobná mechanizácia",unit:"h",oev:false,main:false,terms:[["Revízia",12]]},
  other:{l:"Ostatné",unit:"h",oev:false,main:false,terms:[]}};
const CAT_ORDER=["car","truck","machine","small","other"];
const catOf=m=>CATS[m.cat]||CATS.other;
const OEV_FIELDS=[["ecv","Evidenčné číslo (EČV)","A"],["firstReg","Dátum prvej evidencie","B"],["holder","Držiteľ","C.1"],["make","Továrenská značka","D.1"],
  ["model","Typ / variant / verzia","D.2"],["tradeName","Obchodný názov","D.3"],["vin","VIN","E"],["maxMass","Najväčšia prípustná celková hmotnosť (kg)","F.2"],
  ["opMass","Prevádzková hmotnosť (kg)","G"],["category","Kategória vozidla","J"],["engineCc","Zdvihový objem (cm³)","P.1"],["powerKw","Najväčší výkon (kW)","P.2"],
  ["fuel","Palivo","P.3"],["color","Farba","R"],["seats","Počet miest na sedenie","S.1"],["year","Rok výroby",""]];
const isoAddMonths=(d,n)=>{const x=new Date(d+"T12:00");const day=x.getDate();x.setMonth(x.getMonth()+n);if(x.getDate()<day)x.setDate(0);return x.toISOString().slice(0,10)};
/* suma v eurách: prijme 90 aj 89,50; prázdne = "" ; chybný tvar = null */
const rateVal=id=>{const v=moneyVal(id);return v?+v:0};
const rateKmIn=(id,v)=>`<label>Sadzba za km €<input id="${id}" inputmode="decimal" value="${v?String(v).replace(".",","):""}" placeholder="napr. 0,90"></label>`;
function moneyVal(id){const raw=($("#"+id)?.value||"").trim().replace(/\s|€/g,"").replace(",",".");if(!raw)return "";return /^\d+(\.\d{1,2})?$/.test(raw)?String(+raw):null}
/* koliesko myši nesmie meniť čísla vo formulároch */
document.addEventListener("wheel",e=>{const a=document.activeElement;if(a&&a.type==="number"&&e.target===a)a.blur()},{passive:true});
/* platnosť po obnove: od dátumu obnovy o N mesiacov mínus 1 deň (24. 10. 2026 → 23. 10. 2027) */
function renewUntil(from,months){const x=new Date(isoAddMonths(from,months)+"T12:00");x.setDate(x.getDate()-1);return x.toISOString().slice(0,10)}
const daysTo=d=>Math.round((new Date(d+"T12:00")-new Date(todayIso()+"T12:00"))/864e5);
const nf=n=>Number(n).toLocaleString("sk-SK",{maximumFractionDigits:1});
const ST_RANK={bad:3,soon:2,ok:1,none:0};
const ST_PILL={bad:["Po termíne","s-ret"],soon:["Blíži sa termín","s-open"],ok:["V poriadku","s-ok"],none:["Bez termínov","s-lock"]};
function termStatus(t){if(!t.until)return "none";const d=daysTo(t.until);return d<0?"bad":d<=(+t.warn||30)?"soon":"ok"}
function termText(t){if(!t.until)return "bez dátumu";const d=daysTo(t.until);return d<0?`skončila pred ${-d} ${pl(-d,"dňom","dňami","dňami")}`:d===0?"končí dnes":`ešte ${d} ${pl(d,"deň","dni","dní")}`}
function diaryHoursSince(m,date){return S.diary.reduce((s,e)=>s+(e.date>(date||"")?(e.mach||[]).filter(c=>c.machineId===m.id).reduce((a,c)=>a+(+c.hours||0),0):0),0)}
function counterNow(m){if(!m.reading)return null;const add=catOf(m).unit==="h"?diaryHoursSince(m,m.reading.date):0;return {value:(+m.reading.value||0)+add,add,date:m.reading.date}}
function svcCalc(m,s){const cur=counterNow(m);const nextDate=s.everyMonths&&s.lastDate?isoAddMonths(s.lastDate,+s.everyMonths):null;
  const nextQty=s.everyQty&&s.lastQty!=null&&s.lastQty!==""?(+s.lastQty)+(+s.everyQty):null;
  let st="ok";const parts=[];
  if(nextDate){const d=daysTo(nextDate);if(d<0)st="bad";else if(d<=30&&st!=="bad")st="soon";parts.push(`do ${d2(nextDate)}`)}
  if(nextQty!=null){if(cur){const left=nextQty-cur.value;if(left<=0)st="bad";else if(left<=+s.everyQty*0.1&&st!=="bad")st="soon";parts.push(left>0?`o ${nf(left)} ${catOf(m).unit}`:`prekročené o ${nf(-left)} ${catOf(m).unit}`)}
    else parts.push(`pri ${nf(nextQty)} ${catOf(m).unit}`)}
  if(!nextDate&&nextQty==null)st="none";
  return {st,text:parts.join(" alebo "),nextDate,nextQty}}
function vehItems(m){const out=[];(m.terms||[]).forEach(t=>out.push({m,id:t.id,kind:"term",name:t.kind,st:termStatus(t),text:t.until?`${d2(t.until)} · ${termText(t)}`:"bez dátumu",sort:t.until||"9999"}));
  (m.svcs||[]).forEach(s=>{const c=svcCalc(m,s);out.push({m,id:s.id,kind:"svc",name:s.name,st:c.st,text:c.text,sort:c.nextDate||"9998"})});return out}
function vehStatus(m){return vehItems(m).reduce((w,i)=>ST_RANK[i.st]>ST_RANK[w]?i.st:w,"none")}
function fleetAlerts(){return (S.machines||[]).flatMap(vehItems).filter(i=>i.st==="bad"||i.st==="soon")}
function stPill(st,txt){const [l,c]=ST_PILL[st];return `<span class="pill ${c}">${txt||l}</span>`}
function vehIdText(m){return [m.ecv,catOf(m).main?(m.vin?`VIN …${m.vin.slice(-6)}`:""):m.serial?`v. č. ${m.serial}`:""].filter(Boolean).join(" · ")}

    ${groups||`<div class="card muted">Zatiaľ nie je zadaný žiadny stroj ani vozidlo.</div>`}</div>`}

function vehDetailHTML(m){
  const C=catOf(m),st=vehStatus(m);
  return `<div class="stack">

function oevImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const k=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const data=c.toDataURL("image/jpeg",0.82);c.toBlob(b=>res({data,blob:b}),"image/jpeg",0.82)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"))};img.src=url})}
const OEV_ERR={not_granted:"Čítanie dokladu nebolo povolené. Údaje doplň ručne alebo to skús znova a povoľ ho.",rate_limited:"Príliš veľa požiadaviek naraz. Skús to o chvíľu znova.",
  image_rejected:"Obrázok sa nepodarilo spracovať. Skús ostrejšiu fotku vo formáte JPG alebo PNG.",invalid_json:"Údaje sa nepodarilo vyčítať. Skús ostrejšiu fotku alebo ich doplň ručne.",refused:"Údaje sa nepodarilo vyčítať. Doplň ich ručne."};
async function oevUpload(m,files){
  files=files.filter(f=>/^image\//.test(f.type)).slice(0,2);if(!files.length){toast("Vyber fotku alebo sken vo formáte JPG alebo PNG.");return}
  view.oevBusy=true;view.oevMsg="";view.oevEdit=false;render();
  let imgs;try{imgs=await Promise.all(files.map(oevImage))}catch(e){view.oevBusy=false;view.oevMsg="Obrázok sa nepodarilo načítať.";render();return}
  m.oevPhotos=imgs.map(x=>x.data);save();
  let sample=null;try{sample=await window.claude?.use?.("sample")}catch(e){}
  const lim=sample?await sample.limits().catch(()=>null):null;
  if(!sample||!lim||!lim.images){view.oevBusy=false;view.oevMsg="Automatické vyčítanie tu nie je dostupné. Fotky sú uložené, údaje doplň ručne.";view.oevEdit=true;render();return}
  const keys=OEV_FIELDS.map(([k,l,c])=>`"${k}": ${l}${c?` (pole ${c})`:""}`).join("\n");
  const prompt=`Na ${imgs.length>1?"obrázkoch sú strany":"obrázku je"} slovenského dokladu Osvedčenie o evidencii – časť II (veľký technický preukaz) vozidla alebo stroja.
Vyčítaj z neho tieto údaje a vráť IBA jeden JSON objekt s presne týmito kľúčmi:
${keys}
Pravidlá: ak údaj v doklade nie je alebo nie je čitateľný, daj null. Dátumy vráť v tvare RRRR-MM-DD. Hmotnosti, objem, výkon a počet miest vráť ako čísla bez jednotiek. EČV a VIN bez medzier, veľkými písmenami. Rok výroby ako štvorciferné číslo. Nič si nedomýšľaj.`;
  try{const d=await sample.json(prompt,{images:imgs.map(x=>x.blob),modelTier:"default"});
    const O={};OEV_FIELDS.forEach(([k])=>{const v=d&&d[k];if(v!=null&&v!=="")O[k]=String(v).trim()});
    m.oev=O;if(!m.ecv&&O.ecv)m.ecv=O.ecv.toUpperCase();if(!m.vin&&O.vin)m.vin=O.vin.toUpperCase();if(!m.color&&O.color)m.color=O.color;
    const n=Object.keys(O).length;view.oevMsg=n?`Vyčítaných ${n} ${pl(n,"údaj","údaje","údajov")}. Skontroluj ich podľa dokladu a prípadne oprav.`:"Z dokladu sa nepodarilo vyčítať žiadne údaje. Skús ostrejšiu fotku alebo ich doplň ručne.";
    save()}
  catch(e){view.oevMsg=OEV_ERR[e&&e.code]||"Údaje sa nepodarilo vyčítať. Doplň ich ručne.";if(e&&e.code!=="cancelled")view.oevEdit=!m.oev}
  view.oevBusy=false;render()}

/* ---------- Úlohy: priraďovanie termínov, servisov a kontrolných dní používateľom ---------- */
const MOD_SHORT={personal:"Personalistika",doprava:"Doprava",stavba:"Stavba"};
function rightsShort(u){const e=[],v=[];RIGHT_MODS.forEach(([k])=>{const r=(u.rights||{})[k];if(r==="edit")e.push(MOD_SHORT[k]);else if(r==="view")v.push(MOD_SHORT[k])});
  return [e.length?`${e.join(", ")}: administrácia`:"",v.length?`${v.join(", ")}: zobrazenie`:""].filter(Boolean).join(" · ")}
function projRolesOf(u,T){T=T||S;return [...new Set(T.projects.flatMap(p=>p.members.filter(m=>m.userId===u.id).map(m=>ROLES[m.role])))]}
function userRoleLabel(u){if(isAdmin(u))return "Administrátor";return [rightsShort(u),projRolesOf(u).join(", ")].filter(Boolean).join(" · ")||"bez prístupu"}
function canAssignAny(){return isAdmin(me)||editsSomething()||S.projects.some(p=>roleIn(p)==="stavbyveduci")}
function canAssignSrc(src){if(!me)return false;if(src.t==="term"||src.t==="svc")return canEdit("doprava");if(src.t==="skol")return canEdit("personal");
  if(src.t==="kd"){const p=S.projects.find(x=>x.id===src.p);return !!p&&(isAdmin(me)||canEdit("stavba")||["stavbyveduci","dozor"].includes(roleIn(p)))}return canAssignAny()}
const taskKey=src=>[src.t,src.m||src.p||"",src.i||""].join(":");
const openTaskFor=key=>(S.tasks||[]).find(t=>t.key===key&&(t.status==="open"||t.status==="review"));
/* splnenie: kto úlohu zadal, ju uzatvára sám; inak ide zadávateľovi na kontrolu */
function finishTask(t,note){t.doneAt=nowIso();t.doneBy=me.id;if(note)t.doneNote=note;
  if(me.id===t.by){t.status="done";t.checkedAt=t.doneAt;t.checkedBy=me.id}else t.status="review"}
const canCheck=t=>t.by===me.id||isAdmin(me);
function taskDueSt(t){if(!t.due)return "none";const d=daysTo(t.due);return d<0?"bad":d<=7?"soon":"ok"}
function taskDueText(t){if(!t.due)return "bez termínu";const d=daysTo(t.due);return d<0?`${d2(t.due)} · po termíne ${-d} ${pl(-d,"deň","dni","dní")}`:d===0?`dnes`:`${d2(t.due)} · o ${d} ${pl(d,"deň","dni","dní")}`}
function srcInfo(src){
  if(src.t==="term"||src.t==="svc"){const m=(S.machines||[]).find(x=>x.id===src.m);if(!m)return null;
    if(src.t==="term"){const t=(m.terms||[]).find(x=>x.id===src.i);return t&&{title:`${t.kind} – ${m.name}`,sub:m.ecv||catOf(m).l,due:t.until}}
    const s=(m.svcs||[]).find(x=>x.id===src.i);if(!s)return null;const c=svcCalc(m,s);return {title:`Servis: ${s.name} – ${m.name}`,sub:[m.ecv,c.text].filter(Boolean).join(" · "),due:c.nextDate}}
  if(src.t==="kd"){const p=S.projects.find(x=>x.id===src.p),k=p&&(p.inspections||[]).find(x=>x.id===src.i);return k&&{title:`Kontrolný deň č. ${k.no} – ${p.name}`,sub:`${fmtDate(k.date)} o ${k.time}`,due:k.date}}
  if(src.t==="skol"){const k=(S.trainings||[]).find(x=>x.id===src.i);return k&&{title:`Školenie: ${skolName(k)}`,sub:`${fmtDate(k.date)}${k.time?" o "+k.time:""}${k.place?" · "+k.place:""} · ${k.participants.length} ${pl(k.participants.length,"osoba","osoby","osôb")}`,due:k.date}}
  return null}
function completeTasksFor(key,note){(S.tasks||[]).filter(t=>t.key===key&&t.status==="open").forEach(t=>finishTask(t,note))}
/* ovládací prvok „Priradiť ako úlohu“ vložený pri termíne, servise alebo kontrolnom dni */
function assignBox(src,compact){
  const key=taskKey(src),t=openTaskFor(key),can=canAssignSrc(src);
  if(view.assignFor===key&&can){const us=S.users.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"","sk"));
    return `<form class="assignform" id="assignForm" data-key="${key}" data-src='${esc(JSON.stringify(src))}'>
      <label>Priradiť ako úlohu<select id="asUser" required><option value="">— vyber používateľa —</option>${us.map(u=>`<option value="${u.id}" ${t&&t.assignee===u.id?"selected":""}>${esc(u.name||u.email)} · ${esc(userRoleLabel(u))}</option>`).join("")}</select></label>
      <label>Poznámka k úlohe (nepovinné)<input id="asNote" value="${esc(t?.note)}" placeholder="napr. objednať termín v servise"></label>
      <div class="row"><button class="btn primary small" type="submit">${t?"Zmeniť priradenie":"Priradiť úlohu"}</button><button type="button" class="btn ghost small" data-a="assignNo">Zrušiť</button>
        ${t?`<button type="button" class="btn ghost small" data-a="taskCancel" data-id="${t.id}" style="margin-left:auto">Zrušiť úlohu</button>`:""}</div></form>`}
  if(t){const u=user(t.assignee),rv=t.status==="review";return `<span class="taskchip ${compact?"sm":""} ${rv?"rv":""}" title="${rv?"Splnené, čaká na kontrolu":""}">${icon("task")}<span>${compact?esc(initials(u))+(rv?" ✓":""):`Úloha: ${esc(u?.name||"?")}${rv?" · splnené, čaká na kontrolu":""}`}</span>${can?`<button type="button" class="linkbtn" data-a="assignOpen" data-key="${key}">${compact?"✎":"zmeniť"}</button>`:""}</span>`}
  if(!can)return "";
  return compact?`<button type="button" class="iconbtn" data-a="assignOpen" data-key="${key}" title="Priradiť ako úlohu" aria-label="Priradiť ako úlohu">${icon("assign")}</button>`
    :`<button type="button" class="btn small" data-a="assignOpen" data-key="${key}">${icon("assign","bi")} Priradiť ako úlohu</button>`}
function initials(u){if(!u)return "?";return (u.name||u.email).split(/\s+/).filter(x=>!/^Ing\.|^Mgr\.|^Bc\./.test(x)).map(x=>x[0]).slice(0,2).join("").toUpperCase()}

/* panel Úlohy */
function tasksForView(){const all=(S.tasks||[]).filter(t=>t.status==="open"),mine=all.filter(t=>t.assignee===me.id);
  const vis=isAdmin(me)||editsSomething()?all:all.filter(t=>t.assignee===me.id||t.by===me.id);
  const urgent=vis.filter(t=>["bad","soon"].includes(taskDueSt(t)));
  const review=(S.tasks||[]).filter(t=>t.status==="review"&&canCheck(t)),sent=(S.tasks||[]).filter(t=>t.status==="review"&&t.assignee===me.id&&!canCheck(t));
  return {all:vis,mine,urgent,review,sent}}
function taskRow(t,showWho){const st=taskDueSt(t),u=user(t.assignee),info=srcInfo(t.src||{});const sub=info?info.sub:"";
  const canDone=t.assignee===me.id||t.by===me.id||me.companyRole==="admin";
  return `<li class="task st-${st}"><button class="task-main" data-a="taskGo" data-id="${t.id}"><b>${esc(t.title)}</b>
      ${sub?`<span class="muted">${esc(sub)}</span>`:""}${t.note?`<span class="tnote">${esc(t.note)}</span>`:""}
      <span class="tmeta"><span class="tdue">${esc(taskDueText(t))}</span>${showWho?`<span class="twho">${esc(u?.name||"?")}</span>`:""}</span></button>
    ${canDone?`<button class="tdone" data-a="taskDone" data-id="${t.id}" title="Označiť ako hotové" aria-label="Označiť ako hotové">✓</button>`:""}</li>`}
function reviewRow(t){const u=user(t.doneBy),info=srcInfo(t.src||{});
  return `<li class="task rv"><div class="task-main"><span class="rvtag">Splnené</span><b>${esc(t.title)}</b>${info?`<span class="muted">${esc(info.sub)}</span>`:""}
      <span class="tmeta"><span>${esc(u?.name||"?")} · ${dt(t.doneAt)}</span></span>${t.doneNote?`<span class="tnote">${esc(t.doneNote)}</span>`:""}
      ${view.retFor===t.id?`<form class="row retform" id="taskRetForm" data-id="${t.id}"><input id="trtNote" required placeholder="Čo treba ešte dorobiť"><button class="btn small" type="submit">Vrátiť</button><button type="button" class="btn ghost small" data-a="taskRetNo">Späť</button></form>`
        :`<div class="row"><button class="btn primary small" data-a="taskCheck" data-id="${t.id}">✓ Skontrolované</button><button class="btn ghost small" data-a="taskRet" data-id="${t.id}">Vrátiť na dorobenie</button><button class="linkbtn" data-a="taskGo" data-id="${t.id}">otvoriť</button></div>`}</div></li>`}
function tasksPaneHTML(){
  const {all,mine,urgent,review,sent}=tasksForView(),assigner=canAssignAny()||review.length>0;let tab=view.taskTab==="all"&&assigner?"all":"mine";
  const byDue=(a,b)=>(a.due||"9").localeCompare(b.due||"9"),scope=tab==="all"?all:mine,isUrg=t=>["bad","soon"].includes(taskDueSt(t));
  const urgL=scope.filter(isUrg).sort(byDue),restL=scope.filter(t=>!isUrg(t)).sort(byDue),showWho=tab==="all";
  const sec=(title,cls,inner)=>`<div class="tp-sec ${cls}"><h4>${title}</h4>${inner}</div>`;
  const done=(S.tasks||[]).filter(t=>t.status==="done"&&(t.assignee===me.id||t.by===me.id||me.companyRole==="admin")).sort((a,b)=>(b.checkedAt||b.doneAt||"").localeCompare(a.checkedAt||a.doneAt||"")).slice(0,5);
  const badBadge=mine.some(t=>taskDueSt(t)==="bad");
  const newForm=view.taskNew?`<form class="stack newtask" id="taskNewForm"><label>Úloha<input id="tnTitle" required placeholder="napr. Objednať školenie BOZP"></label>
      <label>Pre koho<select id="tnUser" required><option value="">— vyber používateľa —</option>${S.users.map(u=>`<option value="${u.id}">${esc(u.name||u.email)} · ${esc(userRoleLabel(u))}</option>`).join("")}</select></label>
      <label>Termín (nepovinné)<input type="date" id="tnDue"></label>
      <div class="row"><button class="btn primary small" type="submit">Pridať úlohu</button><button type="button" class="btn ghost small" data-a="taskNewNo">Zrušiť</button></div></form>`:"";
  return `<div class="tp-head" data-a="tpToggle"><div class="tp-title">${icon("task")}<b>Úlohy</b>${mine.length?`<span class="badge ${badBadge?"":"calm"}">${mine.length}</span>`:""}${review.length?`<span class="rvbadge" title="Na kontrolu">✓ ${review.length}</span>`:""}</div>
      <span class="tp-chev" aria-hidden="true">▴</span></div>
    <div class="tp-body">
      <div class="tpseg" role="tablist"><button role="tab" class="${tab==="mine"?"on":""}" data-a="taskTab" data-tab="mine">Moje <span class="num">${mine.length}</span></button>${assigner?`<button role="tab" class="${tab==="all"?"on":""}" data-a="taskTab" data-tab="all">Všetky <span class="num">${all.length}</span></button>`:""}</div>
      ${urgL.length?sec(`Urgentné <span class="num">${urgL.length}</span>`,"urg",`<ul class="tasklist">${urgL.map(t=>taskRow(t,showWho)).join("")}</ul>`):""}
      ${review.length?sec(`Na kontrolu <span class="num">${review.length}</span>`,"rev",`<ul class="tasklist">${review.map(reviewRow).join("")}</ul>`):""}
      ${restL.length?sec(urgL.length||review.length?`Ostatné <span class="num">${restL.length}</span>`:(tab==="all"?"Otvorené úlohy":"Moje úlohy"),"rest",`<ul class="tasklist">${restL.map(t=>taskRow(t,showWho)).join("")}</ul>`):""}
      ${!urgL.length&&!restL.length&&!review.length?`<div class="muted tp-empty">${tab==="mine"?"Nemáš žiadnu otvorenú úlohu.":"Žiadne otvorené úlohy."}</div>`:""}

function attExport(from,to,who){

/* ---------- Doprava a logistika: plánovač (logistika) ---------- */
const NEEDS_DRIVER=["car","truck","machine"];
function weekStart(d){const x=new Date(d+"T12:00");const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x.toISOString().slice(0,10)}
const addD=(d,n)=>{const x=new Date(d+"T12:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const tmin=t=>{const [h,m]=(t||"0:0").split(":").map(Number);return h*60+(m||0)};
function jobHours(j){return Math.max(0,(tmin(j.to)-tmin(j.from))/60)}
/* cenník: za každý stroj hodiny × sadzba/h + km × sadzba/km; hodiny aj km z knihy jázd (skutočnosť),
   kým kniha jázd nie je, hodiny = čas úlohy od–do a km = odhad zadaný pri úlohe */
const numv=v=>+String(v??"").replace(",",".")||0;
function jobKm(j,x){const rows=(j.log||{})[x.machineId];return rows?{km:rows.reduce((s,r)=>s+numv(r.km),0),src:"log"}:{km:numv(x.km),src:x.km?"plan":""}}
function jobCennikParts(j){return (j.machines||[]).map(x=>{const m=machine(x.machineId);if(!m)return null;const k=jobKm(j,x),rows=(j.log||{})[x.machineId];
  const h=rows?rows.reduce((s,r)=>s+numv(r.h),0):jobHours(j),ph=(m.rate||0)*h,pk=(m.rateKm||0)*k.km;return {m,h,km:k.km,src:k.src,ph,pk,sum:ph+pk}}).filter(Boolean)}
function jobCennik(j){return jobCennikParts(j).reduce((s,p)=>s+p.sum,0)}
function cennikText(j){const ps=jobCennikParts(j);if(!ps.length)return "žiadny stroj";
  return ps.map(p=>{const a=[];if(p.m.rate)a.push(`${nf1(p.h)} h × ${eur(p.m.rate)}${p.src==="log"?"":" (čas úlohy)"}`);if(p.m.rateKm&&p.km)a.push(`${nf1(p.km)} km × ${eur(p.m.rateKm)}${p.src==="log"?"":" (odhad)"}`);
    const miss=p.m.rateKm&&!p.km?" (km zatiaľ nezadané)":"";
    return `${p.m.name}${p.src==="log"?" (podľa knihy jázd)":""}: ${a.length?a.join(" + ")+" = "+eur(p.sum)+miss:(p.m.rate||p.m.rateKm?"0 €"+miss:"bez sadzby")}`}).join(" · ")}
function jobPrice(j){return j.priceMode==="own"?(+String(j.price||"").replace(",",".")||0):jobCennik(j)}
function jobPeople(j){return [...new Set([...(j.machines||[]).map(x=>x.driverId).filter(Boolean),...(j.workers||[])])]}
function jobsOn(d){return (S.jobs||[]).filter(j=>j.date===d).sort((a,b)=>a.from.localeCompare(b.from))}
const overl=(a,b)=>tmin(a.from)<tmin(b.to)&&tmin(b.from)<tmin(a.to);
/* kolízie: ten istý stroj alebo človek v ten istý deň (súbežne alebo v inom čase), alebo človek v dochádzke na dovolenke/PN.
   Systém iba upozorní – uloženie sa povolí (napr. jedno auto súčasne pre dve firmy). */
function jobConflictList(j){const out=[];jobsOn(j.date).filter(o=>o.id!==j.id).forEach(o=>{const ov=overl(o,j),
    where=`${o.from}–${o.to} · ${o.place||o.client}${o.place&&o.client?` (${o.client})`:""}`;
    (j.machines||[]).forEach(x=>{if((o.machines||[]).some(y=>y.machineId===x.machineId))out.push({hard:ov,t:`${machine(x.machineId)?.name||"Stroj"} ${ov?"je v rovnakom čase":"má v ten istý deň"} aj úlohu ${where}`})});
    jobPeople(j).forEach(w=>{if(jobPeople(o).includes(w))out.push({hard:ov,t:`${fullName(worker(w)||{})} ${ov?"je v rovnakom čase":"má v ten istý deň"} aj úlohu ${where}`})})});
  jobPeople(j).forEach(w=>{const a=attOf(w,j.date);if(a&&["D","PN","OCR","NV","NPV"].includes(a.t))out.push({hard:true,t:`${fullName(worker(w)||{})} má v dochádzke ${ATT[a.t].l.toLowerCase()}`})});
  const seen=new Set();return out.filter(x=>!seen.has(x.t)&&seen.add(x.t))}
function jobConflicts(j){return jobConflictList(j).map(x=>x.t)}
function conflictNote(c,form){if(!c.length)return "";const hard=c.some(x=>x.hard);
  return `<div class="note cnote ${hard?"hard":""}"><b>${hard?"Pozor – súbežné úlohy v rovnakom čase":"Upozornenie – viac úloh v ten istý deň"}</b><br>${c.map(x=>`${x.hard?"⚠":"•"} ${esc(x.t)}`).join("<br>")}
    ${form?`<div class="hint" style="margin-top:6px">Úlohu je možné uložiť aj tak – napr. ak auto alebo stroj robí súčasne pre dvoch objednávateľov.</div>`:""}</div>`}

      <div class="row"><div class="tpseg" role="tablist" style="min-width:220px"><button class="${mode==="mach"?"on":""}" data-a="logMode" data-m="mach">Stroje a vozidlá</button><button class="${mode==="ppl"?"on":""}" data-a="logMode" data-m="ppl">Zamestnanci</button></div>

    ${view.jobEdit!==undefined&&ed?jobForm():sel?jobDetail(sel,ed):""}

  const wd=daysBetween(X.from,X.to).filter(d=>!isWeekend(d)&&!holiday(d)).length;
  const jobs=(S.jobs||[]).filter(j=>j.date>=X.from&&j.date<=X.to);
  const mach=dxSummary(rows).map(g=>({...g,util:wd?g.days/wd:0}));
  const cl={};jobs.forEach(j=>{const k=j.client||"—";(cl[k]=cl[k]||{name:k,jobs:0,h:0,km:0,sum:0,pre:false});cl[k].jobs++;cl[k].sum+=jobPrice(j)});
  rows.forEach(r=>{const c=cl[r.j.client||"—"];if(c){c.h+=r.h;c.km+=r.km;if(r.pre)c.pre=true}});
  const clients=Object.values(cl).sort((a,b)=>b.sum-a.sum),tot=clients.reduce((s,c)=>s+c.sum,0);
  const pp={};const P=id=>pp[id]||(pp[id]={w:worker(id),days:new Set(),mh:0,km:0,wh:0,pre:false});

  const ws=(S.weighs||[]).filter(w=>w.date>=X.from&&w.date<=X.to&&wDone(w));
  const grp=(key,lab)=>{const g={};ws.forEach(w=>{const k=key(w);(g[k]=g[k]||{name:lab?lab(w):k,n:0,kg:0,in:0,out:0});g[k].n++;g[k].kg+=wNet(w);if(w.dir==="in")g[k].in+=wNet(w);else if(w.dir==="out")g[k].out+=wNet(w)});return Object.values(g)};

const R_TABS=[["nast","Nástenka"],["inv","Inventár"],["podm","Podmienky požičovne"]];

const RENT_TERMS_DEFAULT=`1. Nájomca svojím podpisom potvrdzuje prevzatie uvedeného náradia v úplnom a funkčnom stave vrátane príslušenstva.
2. Nájomca sa zaväzuje používať náradie v súlade s návodom na obsluhu a len na účel, na ktorý je určené. Náradie nesmie prenechať tretej osobe.
3. Nájomné sa počíta za každý začatý deň od prevzatia do vrátenia. Pri vrátení po dohodnutom termíne sa nájomné účtuje za každý ďalší deň.
4. Náradie je potrebné vrátiť očistené, v stave, v akom bolo prevzaté, s prihliadnutím na bežné opotrebenie.
5. Za stratu, odcudzenie alebo poškodenie náradia zodpovedá nájomca v plnej výške. Prenajímateľ je oprávnený započítať škodu so zloženou zálohou.
6. Záloha sa vracia pri vrátení nepoškodeného náradia.`;
const rentTerms=()=>(S.rentTerms??RENT_TERMS_DEFAULT);

const rNum=v=>{const x=+String(v??"").replace(/\s|€/g,"").replace(",",".");return isFinite(x)&&x>0?x:0};
const rDays=(a,b)=>Math.max(1,Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5)+1);
const rEnd=l=>l.status==="back"&&l.returned?l.returned:(l.status==="out"&&l.to<todayIso()?todayIso():l.to);
function rItemPrice(it,days){const d=rNum(it.dayRate),w=rNum(it.weekRate);if(w&&days>=7){const full=Math.floor(days/7)*w,rest=(days%7)*d;return full+Math.min(rest,w)}return days*d}
function rLoanPrice(l){if(l.priceOwn)return rNum(l.price);const days=rDays(l.from,rEnd(l));return (l.items||[]).reduce((s,id)=>{const it=rItem(id);return s+(it?rItemPrice(it,days):0)},0)}
const rDeposit=l=>(l.items||[]).reduce((s,id)=>s+rNum(rItem(id)?.deposit),0);

  if(a==="rTab"){view.rTab=b.dataset.tab;view.rlOpen=null;view.rlEdit=null;view.riEdit=null;render();window.scrollTo(0,0);return}
  if(a==="rlOpen"){view.rlOpen=b.dataset.id;view.rlEdit=null;view.rlDraft=null;render();window.scrollTo({top:0,behavior:"smooth"});return}
  if(a==="rlClose"){view.rlOpen=null;render();return}

  if(a==="rlPdf"){const l=L(b.dataset.id);if(l)rPDF(l);return}
  if(!canEdit("pozicovna"))return;
  if(a==="rtDefault"){S.rentTerms=RENT_TERMS_DEFAULT;save();toast("Obnovený pôvodný text podmienok");render();return}
  if(a==="riNew"){view.riEdit="__new";render()}else if(a==="riEdit"){view.riEdit=b.dataset.id;render();window.scrollTo({top:0,behavior:"smooth"})}else if(a==="riNo"){view.riEdit=null;render()}
  else if(a==="riDel"){const id=b.dataset.id,n=rLoans().filter(l=>(l.items||[]).includes(id)).length;if(n){toast("Náradie je vo výpožičkách – namiesto zmazania ho nastav ako „Vyradené“");return}S.rentItems=rItems().filter(i=>i.id!==id);view.riEdit=null;save();toast("Náradie odstránené");render()}
  else if(a==="rlNew"){view.rlEdit="__new";view.rlDraft=null;view.rlOpen=null;render()}
  else if(a==="rlNewAt"){view.rlEdit="__new";view.rlOpen=null;view.rlDraft={customer:{name:"",company:"",ico:"",phone:"",email:"",address:""},items:[b.dataset.i],from:b.dataset.d,to:addD(b.dataset.d,1),status:"rez",priceOwn:false,price:"",note:""};render();window.scrollTo({top:0,behavior:"smooth"})}
  else if(a==="rlEdit"){view.rlEdit=b.dataset.id;view.rlDraft=null;render()}
  else if(a==="rlNo"){view.rlEdit=null;view.rlDraft=null;render()}
  else if(a==="rlOut"){const l=L(b.dataset.id);l.status="out";if(l.from>todayIso())l.from=todayIso();save();toast(`${l.no} vydané zákazníkovi`);render()}
  else if(a==="rlBack"){const l=L(b.dataset.id);l.status="back";l.returned=todayIso();save();toast(`${l.no} vrátené – cena ${eur(rLoanPrice(l))}`);render()}
  else if(a==="rlDel"){const l=L(b.dataset.id);S.rentals=rLoans().filter(x=>x.id!==l.id);view.rlOpen=null;save();toast(`Výpožička ${l.no} zmazaná`);render()}});

function tripCalc(I){const r={days:[],dom:0,fr:0,cur:"EUR",pocket:0,veh:0,vehKm:0,phmKm:0,tickets:+String(I.tickets||"").replace(",",".")||0,lodging:+String(I.lodging||"").replace(",",".")||0,other:+String(I.other||"").replace(",",".")||0,err:""};
  const s=tms(I.start),e=tms(I.end);if(!(e>s)){r.err="Koniec cesty musí byť po začiatku.";return r}
  const C=CTRY[I.country]||CTRY.SK,foreign=I.country&&I.country!=="SK";r.cur=foreign?C.c:"EUR";
  let bo=tms(I.borderOut),bi=tms(I.borderIn);if(foreign){if(!(bo>=s))bo=s;if(!(bi<=e))bi=e;if(bi<bo)bi=bo}
  daysBetween(I.start.slice(0,10),I.end.slice(0,10)).forEach(d=>{const ds=new Date(d+"T00:00").getTime(),de=ds+864e5,tot=overlapH(s,e,ds,de),frH=foreign?overlapH(bo,bi,ds,de):0,skH=Math.max(0,tot-frH);
    const M=(I.meals||{})[d]||{};let dom=domBand(skH),fr=0;
    if(frH>0)fr=C.r*(frH<=6?.25:frH<=12?.5:1);
    const red=(base)=>base*((M.b?.25:0)+(M.l?.40:0)+(M.d?.35:0));
    if(frH>0&&fr>0)fr=Math.max(0,fr-red(C.r));else if(dom>0)dom=Math.max(0,dom-red(TRAVEL.domFull));
    dom=ceil2(dom);fr=ceil2(fr);r.dom+=dom;r.fr+=fr;r.days.push({d,tot,skH,frH,dom,fr,M})});
  const pp=Math.min(40,Math.max(0,+I.pocket||0));r.pocket=ceil2(r.fr*pp/100);
  if(I.veh==="own"){const km=+String(I.km||"").replace(",",".")||0,cons=+String(I.cons||"").replace(",",".")||0,fuel=+String(I.fuel||"").replace(",",".")||0;
    r.vehKm=km;r.phmKm=cons&&fuel?ceil3(cons/100*fuel):0;r.veh=ceil2((TRAVEL.kmBase+r.phmKm)*km)}
  const fx=+String(I.fx||"").replace(",",".")||0;
  r.eur=r.dom+r.veh+r.tickets+r.lodging+r.other+(r.cur==="EUR"?r.fr+r.pocket:0);
  r.frCur=r.cur==="EUR"?0:r.fr+r.pocket;r.frEur=r.frCur&&fx?ceil2(r.frCur/fx):0;
  r.total=r.eur+r.frEur;r.advance=+String(I.advance||"").replace(",",".")||0;r.balance=r.total-r.advance;r.needFx=!!r.frCur&&!fx;return r}

const PHOTO_MAX=1280, PHOTO_Q=0.7;
function compressImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const k=Math.min(1,PHOTO_MAX/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",PHOTO_Q))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"))};img.src=url})}
function readCaptions(){document.querySelectorAll("[data-cap]").forEach(inp=>{const ph=view.draftPhotos[+inp.dataset.cap];if(ph)ph.caption=inp.value.trim()})}
function refreshPhotoEdit(){const g=$("#phEdit");if(g)g.innerHTML=view.draftPhotos.map(photoEditHTML).join("");const n=view.draftPhotos.length,i=$("#phInfo");if(i)i.textContent=n?`${n} ${pl(n,"fotografia","fotografie","fotografií")}`:"Na mobile môžeš odfotiť priamo z fotoaparátu."}
async function addPhotos(files){readCaptions();let bad=0;const info=$("#phInfo");if(info)info.textContent="Spracúvam fotografie…";
  for(const f of files){if(!/^image\//.test(f.type)){bad++;continue}try{view.draftPhotos.push({id:uid("ph"),data:await compressImage(f),caption:"",by:me.id,at:nowIso()})}catch(e){bad++}}
  refreshPhotoEdit();if(bad)toast(`${bad} ${pl(bad,"súbor sa nepodarilo","súbory sa nepodarilo","súborov sa nepodarilo")} načítať ako fotografiu`)}

const KD_DEFAULT_AGENDA="1. Kontrola postupu prác podľa harmonogramu\n2. Kontrola kvality vykonaných prác\n3. Fakturácia a čerpanie rozpočtu\n4. Rôzne, záver";
const todayIso=()=>nowIso().slice(0,10);
/* všetci, koho možno pozvať: tím stavby, firemné role a kontakty stavby s e-mailom */
function kdCandidates(p){
  const out=[],seen=new Set();
  const add=(key,name,email,role,pre)=>{if(seen.has(key))return;seen.add(key);out.push({key,name,email,role,pre:pre&&key!=="u:"+me.id})};
  S.users.filter(u=>u.companyRole==="admin").forEach(u=>add("u:"+u.id,u.name,u.email,"Administrátor",true));
  (p.contacts||[]).filter(c=>c.role==="Investor").forEach((c,i)=>add("c:inv"+i,c.name||p.investor||"Investor",c.email,"Investor",true));
  p.members.forEach(m=>{const u=user(m.userId);if(u)add("u:"+u.id,u.name,u.email,ROLES[m.role],["stavbyveduci","majster","dozor"].includes(m.role))});
  S.users.filter(u=>!isAdmin(u)&&rightOf(u,"stavba")).forEach(u=>add("u:"+u.id,u.name,u.email,rightOf(u,"stavba")==="edit"?"Správca stavieb":"Sledovanie stavieb",false));
  (p.contacts||[]).filter(c=>c.role!=="Investor"&&c.email).forEach((c,i)=>add("c:o"+i,c.name||c.role,c.email,c.role,false));
  return out}

function kdStatus(k){if(k.status==="cancelled")return ["Zrušený","s-ret"];if(k.status==="held")return ["Uskutočnený","s-ok"];
  return k.date<todayIso()?["Čaká na zápis","s-open"]:["Zvolaný","s-wait"]}

  if(k.status==="planned"&&k.date>=todayIso()&&kdInvitedMe(k)&&!(k.rsvp||{})[me.id]&&k.by!==me.id)
    out.push({p,k,kind:"wait",text:`Pozvánka na kontrolný deň č. ${k.no}: ${fmtDate(k.date)} o ${k.time}, ${k.place}`});
  if(k.status==="cancelled"&&kdInvitedMe(k)&&!(k.seen||{})[me.id]&&k.by!==me.id)

const HOURS_PER_MONTH=173.3; // 40 h × 52 týždňov / 12 mesiacov
const OOPP_ITEMS=["Prilba","Ochranné okuliare","Pracovné rukavice","Bezpečnostná obuv","Reflexná vesta","Chrániče sluchu","Respirátor","Postroj proti pádu","Pracovná bunda"];
const SIZE_SUGG=["XS","S","M","L","XL","XXL","3XL","46","48","50","52","54","56","58","60","62"];
/* odvody zamestnávateľa SR 2026 (%): sociálne poistenie 25,2 + zdravotné 11 = 36,2 */
const EMPLOYER_CONTRIB={year:2026,maxBase:16764,capped:[["Nemocenské",1.4],["Starobné",14],["Invalidné",3],["V nezamestnanosti",0.5],["Na financovanie podpory v čase skrátenej práce",0.5],["Garančné",0.25],["Rezervný fond solidarity",4.75]],
  uncapped:[["Úrazové",0.8],["Zdravotné",11]]};
function employerContrib(gross){const E=EMPLOYER_CONTRIB;const base=Math.min(gross,E.maxBase);
  return E.capped.reduce((s,[,r])=>s+base*r/100,0)+E.uncapped.reduce((s,[,r])=>s+gross*r/100,0)}
function monthlyGross(w){return w.wageType==="month"?(+w.wage||0):(+w.wage||0)*HOURS_PER_MONTH}
function superGrossMonth(w){const g=monthlyGross(w);return g+employerContrib(g)}
/* náklad na 1 hodinu = superhrubá mzda prepočítaná na hodinu */
function workerRate(w){if(!w||!w.wage)return 0;return superGrossMonth(w)/HOURS_PER_MONTH}
const contribPct=()=>[...EMPLOYER_CONTRIB.capped,...EMPLOYER_CONTRIB.uncapped].reduce((s,[,r])=>s+r,0);
function costText(w){if(!w.wage)return "";return `Superhrubá mzda ${eur(superGrossMonth(w))} / mes. · náklad ${eur(workerRate(w))} / hod.`}
function wageText(w){if(!w.wage)return "–";return w.wageType==="month"?`${eur(+w.wage)} / mes.`:`${eur(+w.wage)} / hod.`}
function fullName(w){return [w.firstName,w.lastName].filter(Boolean).join(" ")||w.name||""}
function migrateWorkers(){S.workers.forEach(w=>{if(w.firstName==null){const parts=String(w.name||"").trim().split(/\s+/);w.firstName=parts.shift()||"";w.lastName=parts.join(" ");
  w.wageType=w.wageType||"hour";w.wage=w.wage??w.rate??0;w.sizes=w.sizes||{};w.oopp=w.oopp||[];w.active=w.active!==false;delete w.rate}w.name=fullName(w)})}

const CONTACT_ROLES=["Investor","Objednávateľ","Technický dozor","Projektant","Stavbyvedúci","Iné"];
function parseGPS(s){
  const t=String(s||"").replace(/[°NnEe]/g," ").replace(/;/g,",").trim();
  const m=t.match(/^(-?\d{1,2}(?:[.,]\d+)?)\s*[,\s]\s*(-?\d{1,3}(?:[.,]\d+)?)$/);
  if(!m)return null;const lat=parseFloat(m[1].replace(",",".")),lng=parseFloat(m[2].replace(",","."));
  return Math.abs(lat)<=90&&Math.abs(lng)<=180?{lat,lng}:null}
function gpsText(p){return p.gps?`${p.gps.lat.toFixed(6)}, ${p.gps.lng.toFixed(6)}`:""}
function placeText(p){
  const loc=p.locality||"";
  if(p.locType==="gps"&&p.gps)return [loc,`GPS ${gpsText(p)}`].filter(Boolean).join(" · ");
  return [p.address,loc].filter(Boolean).join(", ")}

async function readBudgetFile(file){
  if(!window.XLSX){toast("Knižnica na čítanie Excelu sa nenačítala. Skús stránku obnoviť.");return}
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
    const sheets=wb.SheetNames.map(n=>{const ws=wb.Sheets[n];const rg=ws["!ref"]?XLSX.utils.decode_range(ws["!ref"]):{s:{r:0,c:0}};
      return {name:n,r0:rg.s.r,c0:rg.s.c,rows:XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:"",blankrows:true})}});
    const d=detectWorkbook(sheets);
    view.imp={fileName:file.name,sheets,sheet:d?d.sheet:0,header:d?d.header:0,map:d?{...d.map}:{}};
    if(!d)toast("Hlavičku som nenašiel automaticky. Nastav riadok hlavičky a stĺpce ručne.");
    render();
  }catch(e){toast("Súbor sa nepodarilo prečítať. Ulož ho v Exceli ako .xlsx a skús znova.")}
}

/* ---------- fakturácia / súpisy prác ---------- */
const PRESETS={week:"Týždeň",two:"2 týždne",month:"Mesiac",custom:"Vlastné obdobie"};
const addDays=(d,n)=>{const x=new Date(d+"T12:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
function presetTo(from,k){if(k==="week")return addDays(from,6);if(k==="two")return addDays(from,13);
  if(k==="month"){const x=new Date(from+"T12:00"),y=x.getFullYear(),m=x.getMonth(),d=x.getDate();let e=new Date(y,m+1,d,12);if(e.getMonth()!==(m+1)%12)e=new Date(y,m+2,1,12);e.setDate(e.getDate()-1);return e.toISOString().slice(0,10)}return from}
function d2(d){const [y,m,dd]=d.split("-");return `${+dd}. ${+m}. ${y}`}
function periodLabel(inv){const f=new Date(inv.from+"T12:00"),t=new Date(inv.to+"T12:00");
  const lastDay=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  if(f.getDate()===1&&t.getDate()===lastDay&&f.getMonth()===t.getMonth()&&f.getFullYear()===t.getFullYear())return `${String(t.getMonth()+1).padStart(2,"0")}/${t.getFullYear()}`;
  return `${d2(inv.from)} – ${d2(inv.to)}`}
const invList=p=>(p.invoices||[]).slice().sort((a,b)=>a.no-b.no);
function invModel(p,inv){
  const earlier=invList(p).filter(x=>x.no<inv.no);
  const rows=[],secs={};const T={b:0,pr:0,cu:0,zo:0};
  p.budget.items.forEach(i=>{
    const pq=earlier.reduce((s,x)=>s+(+x.qty[i.id]||0),0), cq=+inv.qty[i.id]||0, zq=i.qty-pq-cq;
    const r={i,pq,cq,zq,bs:i.qty*i.price,ps:pq*i.price,cs:cq*i.price,zs:zq*i.price};
    rows.push(r);T.b+=r.bs;T.pr+=r.ps;T.cu+=r.cs;T.zo+=r.zs;
    const k=i.section||"";(secs[k]=secs[k]||{b:0,pr:0,cu:0,zo:0});secs[k].b+=r.bs;secs[k].pr+=r.ps;secs[k].cu+=r.cs;secs[k].zo+=r.zs;
  });
  return {rows,secs,T,earlierOpen:earlier.some(x=>!frozen(x))}
}
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
function invTotals(p){let lock=0,open=0;invList(p).forEach(inv=>{const s=p.budget.items.reduce((a,i)=>a+(+inv.qty[i.id]||0)*i.price,0);inv.status==="approved"?lock+=s:open+=s});return {lock,open}}

const INV_ST={open:["Rozpracované","s-open"],returned:["Vrátené na prepracovanie","s-ret"],submitted:["Čaká na odsúhlasenie dozorom","s-wait"],approved:["Odsúhlasené","s-ok"]};

const needsApproval=p=>p.members.some(m=>m.role==="dozor");
function invPill(inv){const [l,c]=INV_ST[inv.status]||INV_ST.open;return `<span class="pill ${c}">${l}${inv.status==="approved"&&inv.invoiceNo?` · faktúra ${esc(inv.invoiceNo)}`:""}</span>`}
const ACT={submitted:"Vystavil súpis a poslal na odsúhlasenie",approved:"Odsúhlasil súpis",approvedDirect:"Vystavil súpis (stavba nemá stavebný dozor)",returned:"Vrátil na prepracovanie",unlocked:"Odomkol súpis",invoiceNo:"Doplnil číslo faktúry"};

function invDetailHTML(p,inv){

function parseQty(v){v=String(v).trim().replace(/\s/g,"").replace(",",".");if(!v)return 0;const n=parseFloat(v);return isFinite(n)?n:null}
function refreshInvNumbers(p,inv){

    set(`[data-cs="${id}"]`,eur(r.cs));set(`[data-zq="${id}"]`,qf(r.zq));set(`[data-zs="${id}"]`,eur(r.zs));
    const tr=document.getElementById("r_"+id);if(tr)tr.classList.toggle("bad",r.zq<-1e-9)});
  Object.entries(M.secs).forEach(([k,v])=>{document.querySelectorAll("[data-sec]").forEach(el=>{if(el.dataset.sec===k)el.textContent=eur(v.cu)});document.querySelectorAll("[data-secz]").forEach(el=>{if(el.dataset.secz===k)el.textContent=eur(v.zo)})});
  ["kCur","tCur"].forEach(id=>{const el=$("#"+id);if(el)el.textContent=eur(M.T.cu)});["kZo","tZo"].forEach(id=>{const el=$("#"+id);if(el)el.textContent=eur(M.T.zo)});
}

async function offerFile(filename,data){

function companyUsersHTML(){
  const rows=S.users.filter(isCompanyRole).map(u=>`<div class="card entry-head"><div style="min-width:0"><b>${esc(u.name)}</b><div class="muted" style="font-size:13px;overflow-wrap:anywhere">${esc(u.email)}</div></div>
    <div class="row">${rolePill(u.companyRole)}${u.id!==me.id?`<button class="btn small ghost" data-a="dropCompanyRole" data-id="${u.id}">Odobrať rolu</button>`:""}</div></div>`).join("");
  return `<h2 style="margin-top:8px">Firemné role</h2>${rows}
    <form class="card stack" id="companyRoleForm"><h3>Pridať firemnú rolu</h3>
      <div class="grid2"><label>E-mail<input type="email" id="crEmail" required placeholder="meno@firma.sk"></label>
      <label>Rola<select id="crRole"><option value="ekonom">Ekonóm</option>${hasMod("stavba")?`<option value="pripravar">Prípravár stavieb</option>`:""}<option value="admin">Administrátor</option></select></label></div>
      <label>Meno (nepovinné)<input id="crName"></label>
      <button class="btn primary" type="submit" style="align-self:flex-start">Pridať</button></form>`}
function rolesHTML(){
  // stĺpce: admin, ekonóm, prípravár, stavbyvedúci, majster, stavebný dozor, iba čítanie
  const rows=[["Vidí všetky stavby firmy",1,1,1,0,0,0,0],["Zakladá stavby",1,0,1,0,0,0,0],["Spravuje zamestnancov a stroje",1,1,0,0,0,0,0],["Vidí a mení mzdy zamestnancov",1,1,0,0,0,0,0],
    ["Ekonomika zákazky",1,1,1,0,0,0,0],["Mení nastavenia stavby",1,0,1,1,0,0,0],["Pozýva ľudí na stavbu",1,0,1,1,0,0,0],["Nahráva rozpočet",1,0,1,1,0,0,0],
    ["Zapisuje denný záznam",1,0,0,1,1,0,0],["Upravuje cudzie záznamy",1,0,0,1,0,0,0],["Podpisuje a uzamyká záznam",1,0,0,1,0,0,0],["Číta denník stavby",1,1,1,1,1,1,1],["Dopisuje zápis dozoru do denníka",0,0,0,0,0,1,0],["Pridáva fotografie do denníka",1,0,0,1,1,0,0],["Vyzýva stavebný dozor na vyjadrenie",1,0,0,1,1,0,0],["Vyjadruje sa k výzvam",0,0,0,0,0,1,0],["Zvoláva kontrolný deň",0,0,0,0,0,1,0],["Dostáva pozvánku na kontrolný deň",1,0,0,1,1,1,0],
    ["Vidí fakturáciu",1,1,1,1,0,1,1],["Zapisuje čerpanie do súpisu",1,0,0,1,0,0,0],["Vystavuje súpis",1,0,0,1,0,0,0],["Odsúhlasuje alebo vracia súpis",0,0,0,0,0,1,0],["Odomyká odsúhlasený súpis",1,0,0,0,0,0,0]];
  const ok=v=>v?`<span class="yes" aria-label="áno">✓</span>`:`<span class="no" aria-label="nie">–</span>`;
  return `<div class="stack"><h2>Role a práva</h2>
    <div class="card tablewrap"><table class="matrix"><thead><tr><th></th>${Object.keys(ROLES).map(r=>`<th>${ROLES[r]}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(ok).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="muted">Administrátor, ekonóm a prípravár stavieb sú firemné role a platia pre všetky stavby. Ostatné role sa prideľujú na konkrétnu stavbu v záložke Tím. Majster upravuje iba svoje záznamy, kým ich stavbyvedúci neuzamkne.</div>
    ${me.companyRole==="admin"?companyUsersHTML():""}</div>`;
}

document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.name==="eWageType"){document.querySelectorAll("[data-wt]").forEach(x=>x.hidden=x.dataset.wt!==t.value);updCost();return}
  if(t.id==="empAll"){view.empAll=t.checked;render();return}
  if(t.id==="fzAll"){view.fzAll=t.checked;render();return}
  if(t.name&&t.name.endsWith("LocType")){const fs=t.closest("fieldset");fs.querySelectorAll("[data-loc]").forEach(x=>x.hidden=x.dataset.loc!==t.value);return}
  if((t.id==="up_logo"||t.id==="up_stamp")&&t.files[0]){uploadFirmImage(t.id.slice(3),t.files[0]);t.value="";return}
  if(t.id==="stampWhite"){view.stampWhite=t.checked;return}
  if(t.id==="fVat"){const l=document.querySelector("[data-vat]");if(l)l.hidden=!t.checked;return}
  if(t.id==="phFile"&&t.files.length){addPhotos([...t.files]);t.value="";return}
  if(t.id==="budgetFile"&&t.files[0])readBudgetFile(t.files[0]);
  else if(t.id==="impSheet"){const I=view.imp;I.sheet=+t.value;const d=detectHeader(I.sheets[I.sheet].rows);I.header=d?d.row:0;I.map=d?{...d.map}:{};render()}
  else if(t.id==="impHeader"){const I=view.imp;I.header=Math.max(0,(+t.value||1)-1-I.sheets[I.sheet].r0);remapFromHeader();render()}
  else if(t.id==="niPreset"||t.id==="niFrom"){const n=view.newInv;if(t.id==="niPreset")n.preset=t.value;else n.from=t.value;if(n.preset!=="custom"||t.id==="niFrom"&&n.to<n.from)n.to=presetTo(n.from,n.preset==="custom"?"week":n.preset);render()}
  else if(t.id==="niTo"){view.newInv.to=t.value;view.newInv.preset="custom";render()}
  else if(t.id==="invOnly"){view.invOnly=t.checked;render()}
  else if(t.id==="edFrom"||t.id==="edTo"){const p=S.projects.find(x=>x.id===view.projectId),inv=p.invoices.find(x=>x.id===view.invId);if(!t.value||frozen(inv))return;
    const nf=t.id==="edFrom"?t.value:inv.from,nt=t.id==="edTo"?t.value:inv.to;if(nt<nf){toast("Dátum Do musí byť po dátume Od");render();return}inv.from=nf;inv.to=nt;save();render()}
  else if(t.dataset.map){view.imp.map[t.dataset.map]=t.value===""?null:+t.value;render()}
});
document.addEventListener("input",ev=>{
  if(ev.target.dataset&&ev.target.dataset.q){const p=S.projects.find(x=>x.id===view.projectId),inv=p.invoices.find(x=>x.id===view.invId);if(!inv||frozen(inv)||!can(p,"inv.edit"))return;
    const v=parseQty(ev.target.value);ev.target.classList.toggle("err-in",v===null);if(v===null)return;if(v)inv.qty[ev.target.dataset.q]=v;else delete inv.qty[ev.target.dataset.q];save();refreshInvNumbers(p,inv);return}

document.addEventListener("submit",ev=>{
  ev.preventDefault();const f=ev.target.id;const p=S.projects.find(x=>x.id===view.projectId);
  if(f==="loginForm"){view.loginEmail=$("#loginEmail").value.trim();view.loginErr="";loginWithPassword(view.loginEmail,$("#loginPw").value)}
  else if(f==="registerForm"){(async()=>{const name=$("#rgName").value.trim(),email=$("#rgEmail").value.trim().toLowerCase(),pw=$("#rgPw").value,pw2=$("#rgPw2").value;
    if(pw.length<8){view.loginErr="Heslo musí mať aspoň 8 znakov.";render();return}
    if(pw!==pw2){view.loginErr="Heslá sa nezhodujú.";render();return}
    if(findAccount(email)){view.loginErr="Účet s týmto e-mailom už existuje. Prihlás sa.";render();return}
    const mods=readMods();if(!Object.values(mods).some(Boolean)){view.loginErr="Vyber aspoň jeden modul.";render();return}
    const t=newTenant(name,email,await hashPw(pw),mods);useTenant(t.id);save();me=t.u;view={screen:"setup",tab:"dennik"};render();window.scrollTo(0,0)})()}
  else if(f==="setPwForm"){(async()=>{const pw=$("#spPw").value,pw2=$("#spPw2").value;
    if(pw.length<8){view.loginErr="Heslo musí mať aspoň 8 znakov.";render();return}if(pw!==pw2){view.loginErr="Heslá sa nezhodujú.";render();return}
    const P=view.pending;useTenant(P.tid);const u=S.users.find(x=>x.id===P.uid);u.pw=await hashPw(pw);finishLogin(u);toast("Heslo nastavené")})()}
  else if(f==="modForm"){if(me.companyRole!=="admin")return;const m=readMods();if(!Object.values(m).some(Boolean)){toast("Nechaj zapnutý aspoň jeden modul");return}
    S.modules=m;save();toast("Moduly uložené");render()}
  else if(f==="firmForm"){if(me.companyRole!=="admin")return;const err=readFirmForm();if(err){view.firmErr=err;render();const e2=document.querySelector("#firmForm .err");if(e2&&e2.scrollIntoView)e2.scrollIntoView({block:"center"});return}
    const setup=ev.target.dataset.mode==="setup";S.firm={...view.firmDraft,setupDone:true};S.company=S.firm.name;if(setup&&!me.name)me.name=S.firm.repName;
    view.firmDraft=null;view.firmErr="";view.firmEditing=false;if(save())toast(setup?"Firma nastavená. Môžeš začať.":"Údaje o firme uložené");
    view=setup?{screen:startScreen(),tab:"dennik"}:{screen:"firma",firmTab:"udaje"};render();window.scrollTo(0,0)}
  else if(f==="newProject"){const d=readProjectFields("np");if(d.error){toast(d.error);return}
    S.projects.push({id:uid("p"),...d,members:[],crewMode:document.querySelector('input[name="npCrew"]:checked').value,machMode:document.querySelector('input[name="npMach"]:checked').value});
    view.newProj=false;save();toast("Stavba založená");render()}
  else if(f==="fzForm"){if(!(isAdmin(me)||canEdit("personal")))return;const v=id=>($("#"+id)?.value||"").trim();const d={persNo:v("fzNo"),firstName:v("fzFirst"),lastName:v("fzLast"),profession:v("fzPos")};
    if(!d.firstName||!d.lastName){toast("Meno a priezvisko sú povinné");return}
    const id=ev.target.dataset.id;if(d.persNo&&S.workers.some(x=>x.id!==id&&x.persNo===d.persNo)){toast(`Osobné číslo ${d.persNo} už má iný zamestnanec`);return}

    r.answer={by:me.id,at:nowIso(),text:txt};view.answerFor=null;save();toast("Vyjadrenie odoslané");render()}
  else if(f==="dnoteForm"){const e=S.diary.find(d=>d.id===ev.target.dataset.id),txt=$("#dnoteText").value.trim();if(!txt||!can(p,"diary.note"))return;
    (e.dozorNotes=e.dozorNotes||[]).push({by:me.id,at:nowIso(),text:txt});view.noteFor=null;save();toast("Zápis dozoru uložený");render()}

  else if(f==="invNoForm"){const inv=p.invoices.find(x=>x.id===view.invId);if(!can(p,"inv.edit"))return;inv.invoiceNo=$("#invNo").value.trim();logInv(inv,"invoiceNo",inv.invoiceNo);save();toast("Číslo faktúry uložené");render()}
  else if(f==="inviteForm"){const email=$("#invEmail").value.trim().toLowerCase(),role=$("#invRole").value;
    if(!inviteRoles(p).includes(role))return;

    const m=p.members.find(m=>m.userId===u.id);
    if(m){m.role=role;toast("Rola aktualizovaná")}else{p.members.push({userId:u.id,role,status:"pozvaný"});toast("Pozvánka pripravená. Odhlás sa a prihlás jeho e-mailom.")}
    save();render()}
